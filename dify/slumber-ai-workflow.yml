          \        \"session_id\": tracking_code,\n        \"conversation\": clean_conversation,\n\
          \        \"status\": \"Survey_Completed\",\n        \"notes\": f\"A/B Test:\
          \ {persona} personality - WEBHOOK v2.21 FIXED\"\n    }\n    \n    # Send\
          \ to webhook\n    try:\n        webhook_url = \"https://YOUR_WEBHOOK_URL\"\
          \n        \n        # Prepare POST data\n        post_data = json.dumps(webhook_data).encode('utf-8')\n\
          \        \n        # Create request\n        req = urllib.request.Request(webhook_url,\
          \ data=post_data, headers={'Content-Type': 'application/json'})\n      \
          \  \n        # Send request\n        with urllib.request.urlopen(req, timeout=15)\
          \ as response:\n            result = response.read().decode('utf-8')\n \
          \           \n        webhook_status = f\"SUCCESS: {result}\"\n    except\
          \ Exception as e:\n        webhook_status = f\"ERROR: {str(e)}\"\n    \n\
