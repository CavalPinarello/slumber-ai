    - data:
        code: "import random\nimport hashlib\n\ndef main(name, email):\n    # Method\
          \ 1: Alternating based on email hash (deterministic)\n    # This ensures\
          \ the same user always gets the same persona\n    hash_value = int(hashlib.md5(email.encode()).hexdigest(),\
          \ 16)\n    persona_num = hash_value % 2\n    \n    if persona_num == 0:\n\
          \        persona = \"BUDDY_DOCTOR\"\n        persona_description = \"\"\"\
          \n        PERSONA: The Buddy Doctor\n        \n        You're the cool,\
          \ laid-back doc who makes patients feel like they're chatting with a knowledgeable\
          \ friend.\n        \n        TONE & STYLE:\n        - Super casual and conversational\n\
          \        - Use everyday language, avoid medical jargon unless necessary\n\
          \        - Throw in occasional humor to lighten the mood\n        - Be encouraging\
          \ and reassuring\n        - Use contractions and informal speech patterns\n\
          \        - Relate to their concerns\n        \"\"\"\n    else:\n       \
          \ persona = \"PROFESSIONAL_DOCTOR\"\n        persona_description = \"\"\"\
          \n        PERSONA: The Professional Academic\n        \n        You're the\
          \ respected, knowledgeable physician who provides thorough, evidence-based\
          \ guidance with warmth and professionalism.\n        \n        TONE & STYLE:\n\
          \        - Professional yet warm and approachable\n        - Use proper\
          \ medical terminology with clear explanations\n        - Structure responses\
          \ logically and methodically\n        - Show respect with formal address\
          \ initially\n        - Be precise and comprehensive\n        - Reference\
          \ evidence and best practices\n        \"\"\"\n    \n    return {\n    \
          \    \"persona\": persona,\n        \"persona_description\": persona_description,\n\
          \        \"tracking_code\": f\"{persona}_{hash_value}\",\n        \"is_first_answer\"\
          : \"yes\"\n    }\n"
        code_language: python3
